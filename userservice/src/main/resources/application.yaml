server:
    port: 8081
spring:
    application:
        name: user-service
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${OIDC_ISSUER_URI}
    datasource:
        url: "${USER_DATABASE_URL:jdbc:postgresql://localhost:5432/fitness_user_db}"
        username: "${USER_DATABASE_USERNAME:postgres}"
        password: "${USER_DATABASE_PASSWORD}"
    jpa:
        hibernate:
            ddl-auto: update
        database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
    instance:
        instance-id: ${spring.application.name}:${server.port}
        non-secure-port: ${server.port}
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

security:
    jwt:
        audience: ${USER_API_AUDIENCE}
        issuer-uri: ${OIDC_ISSUER_URI}
        jwks-uri: ${OIDC_JWKS_URI}
