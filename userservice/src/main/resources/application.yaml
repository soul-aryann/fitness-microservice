server:
    port: 8081
spring:
    application:
        name: user-service
    datasource:
        url: "${USER_DATABASE_URL:jdbc:postgresql://localhost:5432/fitness_user_db}"
        username: "${USER_DATABASE_USERNAME:postgres}"
        password: "${USER_DATABASE_PASSWORD}"
    jpa:
        hibernate:
            ddl-auto: update
        database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
    instance:
        instance-id: ${spring.application.name}:${server.port}
        non-secure-port: ${server.port}
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
