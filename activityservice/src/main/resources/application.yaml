spring:
  application:
    name: activity-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/fitnessactivity
      database: fitnessactivity
        

server:
  port: 8082

eureka:
    instance:
        hostname: localhost
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${server.port}
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
